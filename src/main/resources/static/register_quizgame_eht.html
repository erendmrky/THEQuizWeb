<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kaydol – QuizGame_EHT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: cyan;
            font-family: sans-serif;
            text-align: center;
        }
        .site-title { /* reuse if needed */ }
        .signup-container h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: black;
        }
        .signup-container input {
            display: block;
            width: 320px; max-width: 90%;
            padding: 10px;
            margin: 0 auto 15px;
            border: 1px solid #ccc; border-radius: 4px;
            background: #fff; font-size: 1rem; color: #333;
        }
        .signup-container input::placeholder { color: #666; }
        .signup-button {
            padding: 12px 30px;
            background-color: #4CAF50;
            color: #fff; font-size: 1rem; font-weight: bold;
            border: none; border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        #regMessage { margin-top: 1em; color: red; }
    </style>
</head>
<body>
<div class="signup-container">
    <h2>Aramıza Katılmana Çok Az Kaldı</h2>
    <input id="regEmail"    type="email"    placeholder="Mail Adresi">
    <input id="regUsername" type="text"     placeholder="Kullanıcı Adı">
    <input id="regPassword" type="password" placeholder="Şifre">
    <button id="signupButton" class="signup-button">Kaydol</button>
    <p id="regMessage"></p>
</div>

<script>
    document.getElementById('signupButton').addEventListener('click', async e => {
        e.preventDefault();
        const email    = document.getElementById('regEmail').value;
        const username = document.getElementById('regUsername').value;
        const password = document.getElementById('regPassword').value;
        const msgEl    = document.getElementById('regMessage');

        try {
            const res  = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, username, password })
            });
            const text = await res.text();
            if (res.ok) {
                msgEl.style.color = 'green';
                msgEl.textContent = text;
                setTimeout(() => window.location.href = 'quizgame_eht.html', 1500);
            } else {
                msgEl.style.color = 'red';
                msgEl.textContent = text;
            }
        } catch (err) {
            msgEl.style.color = 'red';
            msgEl.textContent = 'Ağ hatası';
            console.error(err);
        }
    });
</script>
</body>
</html>
